name: Validate toolkit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Validator tests
        run: python -m unittest scripts/test_validate_toolkit.py
      - name: Validate catalog
        run: python scripts/validate-toolkit.py
      - name: Privacy check tests
        run: python -m unittest scripts/test_privacy_check.py
      - name: Privacy check (generic patterns)
        run: python scripts/privacy-check.py
      - name: Installer, contract, drift and equivalence tests (throwaway HOME)
        run: python -m unittest discover -s scripts/toolkit/tests -t .
      - name: Try everything from zero with the full example override (throwaway HOME)
        run: bash examples/override-full/try.sh
