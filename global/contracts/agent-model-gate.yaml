piece: agent-model-gate
dest: hooks/agent-model-gate
kind: hook
event: PreToolUse
probes:
  - name: unrelated tool passes silently
    stdin: {tool_name: Bash, tool_input: {command: ls}}
    exit: [0]
    stdout: empty
  - name: a subagent without a model is denied
    stdin: {tool_name: Agent, session_id: probe, tool_input: {description: explore, prompt: look around}}
    exit: [0]
    stdout: json
    contains: '"deny"'
  - name: a subagent on a cheap model passes
    stdin: {tool_name: Agent, session_id: probe, tool_input: {description: explore, prompt: look around, model: sonnet}}
    exit: [0]
    stdout: empty
  - name: an Opus subagent without a reason is denied
    stdin: {tool_name: Agent, session_id: probe, tool_input: {description: implement, prompt: write it, model: opus}}
    exit: [0]
    stdout: json
    contains: '"deny"'
  - name: a fork needs no model
    stdin: {tool_name: Agent, session_id: probe, tool_input: {subagent_type: fork, description: continue, prompt: go on}}
    exit: [0]
    stdout: empty
  - name: a corrupt config keeps the defaults
    stdin: {tool_name: Agent, session_id: probe, tool_input: {description: explore, prompt: look around}}
    corrupt_config: true
    exit: [0]
    stdout: json
    contains: '"deny"'
  - name: unparseable stdin fails open
    stdin_raw: "{not json"
    exit: [0]
    stdout: empty
