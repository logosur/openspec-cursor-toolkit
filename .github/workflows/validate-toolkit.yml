name: Validate toolkit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Validator tests
        run: python -m unittest scripts/test_validate_toolkit.py
      - name: Validate catalog
        run: python scripts/validate-toolkit.py
