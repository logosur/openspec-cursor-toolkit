name: core
summary: >-
  General mechanics for unattended agent work on one machine: authorship gate, process-kill gate,
  worktree placement, the per-piece config helper and the rules that explain each of them.
requires:
  python: "3.10"
  os: linux
  binaries: [python3, git]
optional:
  binaries:
    pgrep: process-kill-gate evaluates kill patterns with it (procps)
    ddev: worktree placement inside DDEV projects
files:
  - {src: global/scripts/lib/toolkit_config.py, dest: scripts/lib/toolkit_config.py, mode: "0755"}
  - {src: global/hooks/commit-authorship-gate, dest: hooks/commit-authorship-gate, mode: "0755"}
  - {src: global/hooks/process-kill-gate, dest: hooks/process-kill-gate, mode: "0755"}
  - {src: global/hooks/worktree-location-gate, dest: hooks/worktree-location-gate, mode: "0755"}
  - {src: global/scripts/worktree-location, dest: scripts/worktree-location, mode: "0755"}
  - {src: global/rules/autoria-commits.md, dest: rules/autoria-commits.md}
  - {src: global/rules/matar-procesos-solo-propios.md, dest: rules/matar-procesos-solo-propios.md}
  - {src: global/rules/worktrees-ubicacion.md, dest: rules/worktrees-ubicacion.md}
hooks:
  - global/settings/hooks.core.json
config: [worktree-location]
