name: devtools
summary: >-
  Local development helpers shared by every project on the machine: one fixed block of ports per
  project (port-lease) and a private store of the test users that sessions create (test-account).
requires:
  python: "3.10"
  os: linux
  binaries: [python3, git]
optional:
  binaries:
    xclip: test-account copy puts a value on the clipboard (or wl-copy / xsel)
depends: [core]
files:
  - {src: global/scripts/port-lease, dest: scripts/port-lease, mode: "0755"}
  - {src: global/scripts/test-account, dest: scripts/test-account, mode: "0755"}
  - {src: global/rules/puertos-locales-por-proyecto.md, dest: rules/puertos-locales-por-proyecto.md}
  - {src: global/rules/cuentas-de-prueba.md, dest: rules/cuentas-de-prueba.md}
config: [test-account]
